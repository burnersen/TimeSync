ShortDescription: Keeps the Windows clock accurate using several NTP servers.
Description: |-
  TimeSync keeps the Windows clock accurate. It asks several time servers, takes the median, ignores
  outliers and only sets the clock when the servers agree. A small background service keeps the clock
  in sync after start, after waking from sleep and after network changes. The window explains what is
  going on in plain words (dual boot with Linux, wrong time zone, weak CMOS battery, blocked NTP port).
